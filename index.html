<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Identity</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html {
      scroll-behavior: smooth;
    }
    
    body {
      background: linear-gradient(135deg, #1a0a1a, #2d0a2d, #1a0a1a);
      color: #ffb6c1;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    
    .container {
      background: rgba(255, 182, 193, 0.08);
      border: 2px solid #ff69b4;
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 105, 180, 0.3);
    }
    
    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
      color: #fff;
      text-shadow: 0 0 15px #ff69b4;
    }
    
    .subtitle {
      font-size: 1rem;
      margin-bottom: 22px;
      opacity: 0.9;
      line-height: 1.4;
    }
    
    .section {
      margin-bottom: 20px;
      text-align: left;
    }
    
    .section-title {
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: #ff9ecb;
      letter-spacing: 1px;
    }
    
    #profile-pic {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #ff69b4;
      object-fit: cover;
      margin: 0 auto 12px;
      display: block;
      background: #2a0a2a;
    }
    
    .pic-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 8px;
    }
    
    .pic-choices img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid transparent;
      object-fit: cover;
      cursor: pointer;
      transition: 0.2s;
    }
    
    .pic-choices img:hover,
    .pic-choices img.selected {
      border-color: #ff69b4;
      transform: scale(1.1);
    }
    
    select, input {
      width: 100%;
      padding: 13px 14px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      margin-bottom: 8px;
    }
    
    select option {
      background: #2a0a2a;
    }
    
    .name-preview {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin: 12px 0 4px;
      word-break: break-word;
    }
    
    .handle-preview {
      font-size: 1rem;
      color: #ff9ecb;
      margin-bottom: 20px;
      word-break: break-word;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }
    
    button {
      padding: 14px 22px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    
    .btn-accept {
      background: linear-gradient(90deg, #ff69b4, #ff1493);
      color: white;
      flex: 1;
      min-width: 140px;
    }
    
    .btn-random {
      background: transparent;
      border: 2px solid #ff69b4;
      color: #ffb6c1;
    }
    
    .btn-tribute {
      background: linear-gradient(90deg, #00c853, #00e676);
      color: white;
      width: 100%;
      margin-top: 8px;
      font-size: 1.1rem;
      display: none;
    }
    
    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
    }
    
    .btn-tribute:hover {
      box-shadow: 0 0 25px rgba(0, 230, 118, 0.6);
    }
    
    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    
    .modal-content {
      background: #1a0a1a;
      border: 2px solid #ff69b4;
      border-radius: 20px;
      padding: 25px 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    
    .modal-content h2 {
      margin-bottom: 18px;
      color: #fff;
      font-size: 1.3rem;
    }
    
    .pay-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      color: white;
      font-size: 1.05rem;
    }
    
    .paypal  { background: #0070ba; }
    .throne  { background: #ff69b4; }
    
    .close-modal {
      margin-top: 12px;
      background: transparent;
      border: 1px solid #ff69b4;
      color: #ffb6c1;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
        align-items: flex-start;
        padding-top: 20px;
      }
      
      .container {
        padding: 25px 16px;
        border-radius: 20px;
      }
      
      h1 {
        font-size: 1.7rem;
      }
      
      .subtitle {
        font-size: 0.95rem;
      }
      
      #profile-pic {
        width: 110px;
        height: 110px;
      }
      
      .pic-choices img {
        width: 48px;
        height: 48px;
      }
      
      .name-preview {
        font-size: 1.15rem;
      }
      
      .buttons {
        flex-direction: column;
      }
      
      .btn-accept,
      .btn-random {
        width: 100%;
        min-width: unset;
      }
      
      .modal-content {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Setup Identity</h1>
    <p class="subtitle">Choose your fate.<br>Design your new identity for Mommy.</p>
    
    <div class="section">
      <div class="section-title">PROFILE PICTURE</div>
      <img id="profile-pic" src="https://i.imgur.com/tTOXkmj.jpg" alt="Profile">
      
      <div class="pic-choices" id="picChoices">
        <img src="https://i.imgur.com/tTOXkmj.jpg" class="selected" onclick="selectPic(this)">
        <img src="https://i.imgur.com/VjlY5vs.jpg" onclick="selectPic(this)">
        <img src="https://i.imgur.com/QQS3WF4.jpg" onclick="selectPic(this)">
        <img src="https://i.imgur.com/zvSV3Jq.jpg" onclick="selectPic(this)">
        <img src="https://i.imgur.com/NbgKcXJ.jpg" onclick="selectPic(this)">
        <img src="https://i.imgur.com/lAPLiNH.jpg" onclick="selectPic(this)">
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">ASSIGNED ROLE</div>
      <select id="role-select">
        <option>Puppy</option>
        <option>Simp</option>
        <option>Sissy</option>
        <option>Slave</option>
        <option>Wallet</option>
        <option>Good Boy</option>
        <option>Kitten</option>
        <option>Drained Pet</option>
      </select>
    </div>
    
    <div class="section">
      <div class="section-title">YOUR NEW NAME</div>
      <input type="text" id="display-name" value="Pie's Puppy 🐾 #000">
      <input type="text" id="username" value="@naughtyPieMommy">
    </div>
    
    <div class="name-preview" id="preview-name">Pie's Puppy 🐾 #000</div>
    <div class="handle-preview" id="preview-handle">@naughtyPieMommy</div>
    
    <div class="buttons">
      <button class="btn-random" onclick="randomProfile()">Random Profile</button>
      <button class="btn-accept" onclick="acceptIdentity()">Accept Identity</button>
    </div>

    <button class="btn-tribute" id="tributeBtn" onclick="openTribute()">💸 Send Tribute</button>
    
    <p class="footer">Once accepted, your old identity is gone forever.</p>
  </div>

  <div class="modal" id="tributeModal">
    <div class="modal-content">
      <h2>Send Tribute to Mommy</h2>
      
      <a href="https://paypal.me/HoneyPiee22" target="_blank" class="pay-btn paypal">PayPal</a>
      <a href="https://throne.com/naughtymommypie" target="_blank" class="pay-btn throne">Throne Wishlist</a>
      
      <button class="close-modal" onclick="closeTribute()">Close</button>
    </div>
  </div>

  <script>
    const DEFAULT_PREFIX = "Pie's";
    const DEFAULT_EMOJI = "🐾";

    const roles = ["Puppy", "Simp", "Sissy", "Slave", "Wallet", "Good Boy", "Kitten", "Drained Pet"];
    const numbers = Array.from({length: 200}, (_, i) => String(i).padStart(3, "0"));

    function selectPic(img) {
      document.getElementById("profile-pic").src = img.src;
      document.querySelectorAll('.pic-choices img').forEach(function(i) {
        i.classList.remove('selected');
      });
      img.classList.add('selected');
    }

    function updatePreview() {
      document.getElementById("preview-name").textContent = document.getElementById("display-name").value;
      document.getElementById("preview-handle").textContent = document.getElementById("username").value;
    }

    document.getElementById("display-name").addEventListener("input", updatePreview);
    document.getElementById("username").addEventListener("input", updatePreview);
    
    document.getElementById("role-select").addEventListener("change", function() {
      const role = this.value;
      document.getElementById("display-name").value = `${DEFAULT_PREFIX} ${role} ${DEFAULT_EMOJI} #${randomNumber()}`;
      document.getElementById("username").value = `@pieslave`;
      updatePreview();
    });

    function randomNumber() {
      return numbers[Math.floor(Math.random() * numbers.length)];
    }

    function randomProfile() {
      const role = roles[Math.floor(Math.random() * roles.length)];
      const num = randomNumber();
      document.getElementById("role-select").value = role;
      document.getElementById("display-name").value = `${DEFAULT_PREFIX} ${role} ${DEFAULT_EMOJI} #${num}`;
      document.getElementById("username").value = `@pie${role.toLowerCase()}${num}`;
      updatePreview();
    }

    function acceptIdentity() {
      const name = document.getElementById("display-name").value;
      alert(`Identity accepted!\n\nYou are now:\n${name}\n\nYour old self is gone.\n\nNow show your devotion...`);
      document.getElementById("tributeBtn").style.display = "block";
    }

    function openTribute() {
      document.getElementById("tributeModal").style.display = "flex";
    }

    function closeTribute() {
      document.getElementById("tributeModal").style.display = "none";
    }

    document.getElementById("tributeModal").addEventListener("click", function(e) {
      if (e.target === this) closeTribute();
    });

    randomProfile();
  </script>
</body>
</html>
